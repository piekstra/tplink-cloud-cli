name: release

# Cut a release by pushing a tag like `v0.2.0`. Cross-platform artifacts live
# here rather than in per-push CI, so the expensive macOS runner (about 10x
# Linux) is billed once per release instead of once per commit. One job per
# OS: Linux and ONE macOS job (Apple Silicon, which cross-compiles the Intel
# target; the macOS SDK is universal). No Windows: SECURITY.md says why. Build
# jobs are independent (fail-fast: false) and each attaches its own tarballs,
# so a slow or dead macOS queue never blocks the Linux assets. The `.mcpb`
# (Claude Desktop extension) needs both, so it is packed last, on Linux.
#
# Only `publish`, which runs on a tag alone and runs no third-party build
# code, can write to the repository; building and packing (cargo, npx)
# happen with a read-only token that checkout does not persist. The Homebrew
# formula follows through a pull request on piekstra/homebrew-tap (branch
# `formula/tplc-v<version>`), which needs the piekstra-dev review and a merge
# before `brew` sees the release.
#
# aarch64 Linux is omitted on purpose: the secret-service keyring backend links
# libdbus, awkward to cross-compile.
#
# The versions are checked before anything is built: the tag, Cargo.toml
# and the .mcpb manifest must agree, or nothing is built or published.
# `publish` attaches whatever was built to a draft, even when one OS failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft.
#
# A pull request that changes how releases are built, or the dependencies
# and version (Cargo.toml, Cargo.lock), runs every job but `publish` as a
# dry run: everything is built and packed, nothing is attached to a
# release. The macOS build runs nowhere else, so a dependency that breaks it
# shows on its pull request, not on the tag. The version
# agreement also runs on every pull request, in tests/packaging.rs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The manifest's version must be the crate's, and on a tag the tag's, or
  # self-update and Claude Desktop would see one version and run another.
  versions:
    name: check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag, Cargo.toml and manifest agree
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          manifest_version=$(jq -r .version packaging/mcpb/manifest.json)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::packaging/mcpb/manifest.json is $manifest_version but Cargo.toml is $version"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Asset names are the contract `tplc self-update` resolves against:
      # <bin>-<target>.tar.gz plus a sibling .sha256. The bare binaries also
      # go to bin/<target>/ for the .mcpb job.
      - name: Build and package each target
        run: |
          set -euo pipefail
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            exe=tplc
            tar -C "target/$t/release" -czf "tplc-$t.tar.gz" "$exe"
            sha256 "tplc-$t.tar.gz" > "tplc-$t.tar.gz.sha256"
            mkdir -p "bin/$t"
            cp "target/$t/release/$exe" "bin/$t/"
          done
      # Claude Desktop picks a binary by OS, not by CPU, so the .mcpb carries
      # one universal macOS binary.
      - name: Universal macOS binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin/universal-apple-darwin
          lipo -create -output bin/universal-apple-darwin/tplc \
            bin/aarch64-apple-darwin/tplc bin/x86_64-apple-darwin/tplc
          lipo -info bin/universal-apple-darwin/tplc
      # A binary that fails at startup is not published. The x86_64 macOS slice cannot
      # run on this arm64 runner. None of this reads a credential.
      - name: Run what this runner can run
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) bins=(bin/aarch64-apple-darwin/tplc bin/universal-apple-darwin/tplc) ;;
            *) bins=(bin/x86_64-unknown-linux-gnu/tplc) ;;
          esac
          for b in "${bins[@]}"; do
            "$b" --version
            "$b" mcp --list-tools > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: bin/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            tplc-*.tar.gz
            tplc-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  mcpb:
    name: pack the Claude Desktop extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The `versions` job has already held the manifest to Cargo.toml and
      # the tag.
      - name: Assemble, validate and pack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stage="$RUNNER_TEMP/tplc"
          mkdir -p "$stage/server/linux"
          cp packaging/mcpb/manifest.json LICENSE "$stage/"
          cp bin/universal-apple-darwin/tplc "$stage/server/tplc"
          cp bin/x86_64-unknown-linux-gnu/tplc "$stage/server/linux/tplc"
          # Artifacts drop the executable bit; the .mcpb keeps what it is given.
          chmod +x "$stage/server/tplc" "$stage/server/linux/tplc"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$stage" "tplc-$version.mcpb"
          sha256sum "tplc-$version.mcpb" > "tplc-$version.mcpb.sha256"
          unzip -Z "tplc-$version.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcpb
          path: tplc-*.mcpb*
          retention-days: 7
          if-no-files-found: error

  # Attaches whatever was built to a draft, even when one OS failed, so a dead
  # macOS queue still leaves the Linux tarball there. Publishes the draft only when
  # nothing expected is missing, and otherwise fails. Never runs when the versions
  # disagree.
  publish:
    name: publish the release
    needs: [versions, build, mcpb]
    if: ${{ !cancelled() && needs.versions.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # A draft first, because `self-update` reads the latest published release: a
      # build that failed leaves the assets it did get on a draft, and nobody on the
      # platform it failed for is sent to a release that lacks theirs.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/tplc-*.tar.gz
            dist/tplc-*.tar.gz.sha256
            dist/tplc-*.mcpb
            dist/tplc-*.mcpb.sha256
          generate_release_notes: true
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "tplc-$t.tar.gz" "tplc-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          for f in "tplc-$version.mcpb" "tplc-$version.mcpb.sha256"; do
            [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Keep `brew install piekstra/tap/tplc` working: point the formula at the
  # new tarballs. The tap's main takes changes only through a reviewed pull
  # request, so this opens one; brew sees the release once piekstra-dev
  # approves it and it merges. Skipped (not failed) when the tap token isn't
  # configured. TAP_TOKEN needs contents and pull-request write on the tap.
  homebrew:
    name: update homebrew tap
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: update formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set, skipping Homebrew update"
            exit 0
          fi
          sha() { awk '{print $1}' "dist/tplc-$1.tar.gz.sha256"; }
          BASE_URL="https://github.com/piekstra/tplink-cloud-cli/releases/download/v${VERSION}"
          cat > /tmp/tplc.rb <<RUBY
          class Tplc < Formula
            desc "TP-Link Kasa and Tapo smart-home devices from the terminal"
            homepage "https://github.com/piekstra/tplink-cloud-cli"
            license "GPL-3.0"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/tplc-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "${BASE_URL}/tplc-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              url "${BASE_URL}/tplc-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$(sha x86_64-unknown-linux-gnu)"
            end

            def install
              bin.install "tplc"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tplc --version")
            end
          end
          RUBY
          # The tap's main takes changes only through a reviewed pull request.
          # One branch per release, cut from main, so the pull request never
          # conflicts, and piekstra-dev is asked to review it. The newest
          # version wins: a run for a version older than the tap's or than an
          # open formula PR's (a late or re-run job) changes nothing, and a
          # run closes only older formula PRs and deletes only older formula
          # branches, including ones a failed run left behind.
          # Fork PRs are ignored, since `--head` matches on the branch name
          # alone. `gh api` prints a 404's body to stdout, hence `|| VAR=""`
          # outside `$()`.
          TAP=piekstra/homebrew-tap
          FILE=Formula/tplc.rb
          PREFIX=formula/tplc-v
          BRANCH="$PREFIX$VERSION"
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          MAIN_JSON=$(gh api "repos/$TAP/contents/$FILE" 2>/dev/null) || MAIN_JSON=""
          MAIN_BLOB=$(printf '%s' "$MAIN_JSON" | jq -r '.sha // empty' 2>/dev/null) || MAIN_BLOB=""
          MAIN_VERSION=$(printf '%s' "$MAIN_JSON" | jq -r '.content // empty' 2>/dev/null | base64 --decode 2>/dev/null \
            | sed -n 's/^ *version "\(.*\)"$/\1/p' | head -1)
          NEW_BLOB=$(git hash-object /tmp/tplc.rb)
          if [ "$NEW_BLOB" = "$MAIN_BLOB" ]; then
            echo "The tap already has tplc v${VERSION}"
            exit 0
          fi
          if [ -n "$MAIN_VERSION" ] && newer "$MAIN_VERSION" "$VERSION"; then
            echo "::notice title=Homebrew::The tap has tplc v$MAIN_VERSION, newer than v$VERSION; left alone."
            exit 0
          fi
          OPEN=$(gh pr list -R "$TAP" --state open --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"$PREFIX\")) | \"\(.number) \(.headRefName | ltrimstr(\"$PREFIX\"))\"")
          while read -r N V; do
            if [ -n "$V" ] && newer "$V" "$VERSION"; then
              echo "::notice title=Homebrew::Formula PR #$N carries tplc v$V, newer than v$VERSION; left alone."
              exit 0
            fi
          done <<EOF
          $OPEN
          EOF
          if ! gh api "repos/$TAP/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$TAP/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$MAIN_SHA" >/dev/null
          fi
          BRANCH_BLOB=$(gh api "repos/$TAP/contents/$FILE?ref=$BRANCH" --jq .sha 2>/dev/null) || BRANCH_BLOB=""
          if [ "$NEW_BLOB" != "$BRANCH_BLOB" ]; then
            CONTENT=$(base64 < /tmp/tplc.rb | tr -d '\n')
            if [ -n "$BRANCH_BLOB" ]; then
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="tplc ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" -f sha="$BRANCH_BLOB" >/dev/null
            else
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="tplc ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" >/dev/null
            fi
          fi
          PR=$(gh pr list -R "$TAP" --head "$BRANCH" --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create -R "$TAP" --head "$BRANCH" --base main --title "tplc ${VERSION}" \
              --body "Moves the tplc formula to https://github.com/piekstra/tplink-cloud-cli/releases/tag/v${VERSION}. Opened by the tplink-cloud-cli release workflow; each sha256 is the one that release published.")
          fi
          gh pr edit "$PR" -R "$TAP" --add-reviewer piekstra-dev >/dev/null 2>&1 \
            || echo "::warning title=Homebrew::Could not request piekstra-dev's review on $PR"
          while read -r N V; do
            if [ -n "$V" ] && [ "$V" != "$VERSION" ]; then
              gh pr close "$N" -R "$TAP" --delete-branch --comment "Superseded by $PR."
            fi
          done <<EOF
          $OPEN
          EOF
          if REFS=$(gh api "repos/$TAP/git/matching-refs/heads/$PREFIX" --jq '.[].ref' 2>/dev/null); then
            for REF in $REFS; do
              V=${REF#refs/heads/"$PREFIX"}
              if [ "$V" != "$VERSION" ] && newer "$VERSION" "$V"; then
                gh api -X DELETE "repos/$TAP/git/$REF" >/dev/null 2>&1 \
                  || echo "::warning title=Homebrew::Could not delete the stale branch $REF"
              fi
            done
          else
            echo "::warning title=Homebrew::Could not list formula branches on $TAP; stale ones were not cleaned up"
          fi
          echo "::notice title=Homebrew::$PR moves tplc to v${VERSION}; brew sees it after the piekstra-dev review and merge."
