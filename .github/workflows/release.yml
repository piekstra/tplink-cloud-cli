name: Release

# Automatic releases. On every push to `main`, if the version in Cargo.toml has
# no matching `v<version>` git tag yet, this builds per-platform binaries and
# publishes a release (creating the tag at the merge commit). So cutting a
# release is just: bump `version` in Cargo.toml and merge — no manual tagging.
# The Homebrew formula follows through a pull request on piekstra/homebrew-tap
# (branch `formula/tplc-v<version>`), which needs the piekstra-dev review and
# a merge before `brew` sees the release.
# Can also be run by hand from the Actions tab (workflow_dispatch).
#
# Assets are `tplc-<target>.tar.gz` (+ `.sha256`), exactly the name
# `tplc self-update` looks for on the latest release. aarch64 Linux is
# intentionally omitted: the secret-service keyring backend links libdbus,
# awkward to cross-compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell whether this version already shipped
      - id: v
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git tag -l "v$version" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          # Ubuntu mirrors fail index downloads now and then; retry before giving up.
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          tar -czf "tplc-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" tplc
          shasum -a 256 "tplc-${{ matrix.target }}.tar.gz" > "tplc-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tplc-${{ matrix.target }}
          path: tplc-${{ matrix.target }}.tar.gz*

  release:
    name: publish release
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Keep `brew install piekstra/tap/tplc` working: point the formula at the
  # new tarballs. The tap's main takes changes only through a reviewed pull
  # request, so this opens one; brew sees the release once piekstra-dev
  # approves it and it merges. Skipped (not failed) when the tap token isn't
  # configured. TAP_TOKEN needs contents and pull-request write on the tap.
  homebrew:
    name: update homebrew tap
    needs: [check, release]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: update formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set, skipping Homebrew update"
            exit 0
          fi
          sha() { awk '{print $1}' "dist/tplc-$1.tar.gz.sha256"; }
          BASE_URL="https://github.com/piekstra/tplink-cloud-cli/releases/download/v${VERSION}"
          cat > /tmp/tplc.rb <<RUBY
          class Tplc < Formula
            desc "TP-Link Kasa and Tapo smart-home devices from the terminal"
            homepage "https://github.com/piekstra/tplink-cloud-cli"
            license "GPL-3.0"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/tplc-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "${BASE_URL}/tplc-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              url "${BASE_URL}/tplc-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "$(sha x86_64-unknown-linux-gnu)"
            end

            def install
              bin.install "tplc"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tplc --version")
            end
          end
          RUBY
          # The tap's main takes changes only through a reviewed pull request.
          # One branch per release, cut from main, so the pull request never
          # conflicts, and piekstra-dev is asked to review it. The newest
          # version wins: a run for a version older than the tap's or than an
          # open formula PR's (a late or re-run job) changes nothing, and a
          # run closes only older formula PRs and deletes only older formula
          # branches, including ones a failed run left behind.
          # Fork PRs are ignored, since `--head` matches on the branch name
          # alone. `gh api` prints a 404's body to stdout, hence `|| VAR=""`
          # outside `$()`.
          TAP=piekstra/homebrew-tap
          FILE=Formula/tplc.rb
          PREFIX=formula/tplc-v
          BRANCH="$PREFIX$VERSION"
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          MAIN_JSON=$(gh api "repos/$TAP/contents/$FILE" 2>/dev/null) || MAIN_JSON=""
          MAIN_BLOB=$(printf '%s' "$MAIN_JSON" | jq -r '.sha // empty' 2>/dev/null) || MAIN_BLOB=""
          MAIN_VERSION=$(printf '%s' "$MAIN_JSON" | jq -r '.content // empty' 2>/dev/null | base64 --decode 2>/dev/null \
            | sed -n 's/^ *version "\(.*\)"$/\1/p' | head -1)
          NEW_BLOB=$(git hash-object /tmp/tplc.rb)
          if [ "$NEW_BLOB" = "$MAIN_BLOB" ]; then
            echo "The tap already has tplc v${VERSION}"
            exit 0
          fi
          if [ -n "$MAIN_VERSION" ] && newer "$MAIN_VERSION" "$VERSION"; then
            echo "::notice title=Homebrew::The tap has tplc v$MAIN_VERSION, newer than v$VERSION; left alone."
            exit 0
          fi
          OPEN=$(gh pr list -R "$TAP" --state open --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"$PREFIX\")) | \"\(.number) \(.headRefName | ltrimstr(\"$PREFIX\"))\"")
          while read -r N V; do
            if [ -n "$V" ] && newer "$V" "$VERSION"; then
              echo "::notice title=Homebrew::Formula PR #$N carries tplc v$V, newer than v$VERSION; left alone."
              exit 0
            fi
          done <<EOF
          $OPEN
          EOF
          if ! gh api "repos/$TAP/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$TAP/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$MAIN_SHA" >/dev/null
          fi
          BRANCH_BLOB=$(gh api "repos/$TAP/contents/$FILE?ref=$BRANCH" --jq .sha 2>/dev/null) || BRANCH_BLOB=""
          if [ "$NEW_BLOB" != "$BRANCH_BLOB" ]; then
            CONTENT=$(base64 < /tmp/tplc.rb | tr -d '\n')
            if [ -n "$BRANCH_BLOB" ]; then
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="tplc ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" -f sha="$BRANCH_BLOB" >/dev/null
            else
              gh api -X PUT "repos/$TAP/contents/$FILE" -f message="tplc ${VERSION}" \
                -f content="$CONTENT" -f branch="$BRANCH" >/dev/null
            fi
          fi
          PR=$(gh pr list -R "$TAP" --head "$BRANCH" --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create -R "$TAP" --head "$BRANCH" --base main --title "tplc ${VERSION}" \
              --body "Moves the tplc formula to https://github.com/piekstra/tplink-cloud-cli/releases/tag/v${VERSION}. Opened by the tplink-cloud-cli release workflow; each sha256 is the one that release published.")
          fi
          gh pr edit "$PR" -R "$TAP" --add-reviewer piekstra-dev >/dev/null 2>&1 \
            || echo "::warning title=Homebrew::Could not request piekstra-dev's review on $PR"
          while read -r N V; do
            if [ -n "$V" ] && [ "$V" != "$VERSION" ]; then
              gh pr close "$N" -R "$TAP" --delete-branch --comment "Superseded by $PR."
            fi
          done <<EOF
          $OPEN
          EOF
          REFS=$(gh api "repos/$TAP/git/matching-refs/heads/$PREFIX" --jq '.[].ref' 2>/dev/null) || REFS=""
          for REF in $REFS; do
            V=${REF#refs/heads/"$PREFIX"}
            if [ "$V" != "$VERSION" ] && newer "$VERSION" "$V"; then
              gh api -X DELETE "repos/$TAP/git/$REF" >/dev/null 2>&1 || true
            fi
          done
          echo "::notice title=Homebrew::$PR moves tplc to v${VERSION}; brew sees it after the piekstra-dev review and merge."
